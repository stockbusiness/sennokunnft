# 千ノ国NFTマーケット CI
#
# 検査の中身は package.json の `verify` に集約している。
# ここに手順を書き写さないのは、CI にしか無い検査を作らず、
# 手元とまったく同じコマンドで再現できるようにするため。

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ✅ 本番サービスへ接続しない。実行環境を明示的にテスト用に固定する。
  APP_ENV: test
  NODE_ENV: test

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # クリーン環境で導入できることを検証する。
      # --frozen-lockfile により、lockfile と package.json の不一致を失敗にする。
      - name: install
        run: pnpm install --frozen-lockfile

      # 秘密情報の混入 → 依存グラフ → lint → typecheck → test → build
      # 秘密の検査を最初に置くのは、混入時にできるだけ早く止めるため。
      - name: verify
        run: pnpm verify

      - name: format check
        run: pnpm format:check

      # Prisma Client が単体で生成できることを確認する（DB 接続は不要）。
      - name: prisma generate
        run: pnpm db:generate

  e2e:
    name: e2e (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      - name: install browser
        run: pnpm --filter @sengoku/web run e2e:install

      - name: e2e
        run: pnpm e2e
