# 千ノ国NFTマーケット CI
#
# 検査の中身は package.json の `verify` に集約している。
# ここに手順を書き写さないのは、CI にしか無い検査を作らず、
# 手元とまったく同じコマンドで再現できるようにするため。

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ✅ 本番サービスへ接続しない。実行環境を明示的にテスト用に固定する。
  APP_ENV: test
  NODE_ENV: test

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 結合テストは実 PostgreSQL に対して行う。
    # CHECK 制約や UNIQUE 制約が「書かれている」ことではなく
    # 「効く」ことを確かめるのが目的なので、ここをモックにはできない。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sennokunnft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sennokunnft_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sennokunnft_test
      # 接続先が未設定のまま結合テストを黙って飛ばさせない。
      REQUIRE_INTEGRATION_TESTS: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # クリーン環境で導入できることを検証する。
      # --frozen-lockfile により、lockfile と package.json の不一致を失敗にする。
      - name: install
        run: pnpm install --frozen-lockfile

      # 結合テストの前にスキーマを適用する。
      # migrate deploy は生成済みのマイグレーションを当てるだけで、
      # スキーマから勝手に差分を作らない（本番と同じ経路）。
      - name: apply migrations
        run: pnpm db:migrate:deploy

      # 秘密情報の混入 → 依存グラフ → 未決定事項レジスタ
      #   → lint → typecheck → test → build
      # 秘密の検査を最初に置くのは、混入時にできるだけ早く止めるため。
      - name: verify
        run: pnpm verify

      - name: format check
        run: pnpm format:check

      # Prisma Client が単体で生成できることを確認する（DB 接続は不要）。
      - name: prisma generate
        run: pnpm db:generate

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 通しシナリオ（登録 → 公開 → 出品 → 閲覧）は実 API と実 DB に対して行う。
    # ここをモックにすると「画面は動くが実際には繋がっていない」を見逃す。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sennokunnft_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sennokunnft_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      # 通しシナリオが使う運営アカウントを用意する。
      - name: prepare database
        run: |
          pnpm db:migrate:deploy
          pnpm db:seed

      # ブラウザ本体だけを取得する。`--with-deps` を外した理由:
      # ubuntu-latest のイメージには Chromium の共有ライブラリが既に入っており、
      # apt が実際に取ってくるのはフォントだけだった（run #84 のログで確認）。
      # そのフォント 21MB の取得が Ubuntu ミラーの遅さに引きずられて
      # 4分34秒（77kB/s）かかり、run #85 では 20 分の上限を食い潰して
      # テストが 1 件も走らないまま打ち切られた。
      # ブラウザ本体は CDN から 9 秒で落ちてくる。
      # 共有ライブラリが将来欠けた場合は、次の e2e が Playwright 自身の
      # 「Host system is missing dependencies」で不足パッケージ名ごと落ちる。
      - name: install browser
        timeout-minutes: 5
        run: pnpm --filter @sengoku/web run e2e:install

      # 日本語フォント。スマホ幅の「横にはみ出さない」検査は文字の幅を測るので、
      # 和文フォントがあるほうが本番に近い形で測れる。
      #
      # ただし止まらないようにした。run #86 では `apt-get update` が
      # 索引の更新だけで 4 分を使い切った。ミラーが azure.archive.ubuntu.com
      # ではなく archive.ubuntu.com に解決された回で、取得量の問題ではなく
      # ミラーの引きの問題。付け足しのフォントの都合で通しシナリオを
      # 1 件も走らせないのは本末転倒なので、失敗しても先へ進める。
      - name: install fonts
        continue-on-error: true
        timeout-minutes: 4
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-ipafont-gothic

      # 上の手順は落ちることがあるので、どのフォントで測ったのかを必ず残す。
      # 幅の検査の結果が回によって変わったとき、ここを見れば理由が分かる。
      - name: record font environment
        run: fc-match -s :lang=ja | head -3

      - name: e2e
        run: pnpm e2e
