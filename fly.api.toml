# api（NestJS）— 本番。
#
# ⚠️ **worker と同じアプリにしない。**
# 同居させると台数を独立に変えられず、api を 2 台にした瞬間に
# worker も 2 台になる。worker の 2 台化は代理店システムへの
# 二重呼び出しを起こす（docs/PRODUCTION_ARCHITECTURE.md §3-2）。
#
# 変更したら `fly config validate --config fly.api.toml` で確かめること。

app = "sennokunnft-api"
primary_region = "nrt"
# ⚠️ 停止時、処理中の要求が終わるのを待つ。短くすると応答を返せずに切れる。
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  # ✅ **`production`（2026-08-18 に `staging` から変更）。**
  #
  #    以前ここが `staging` だったのは、`assertProductionSafety` が
  #    APP_ENV=production のとき AUTH_PROVIDER=dev を拒否し、
  #    当時は dev しか候補が無かったため。UD-801 が解決して
  #    AUTH_PROVIDER=supabase になり、その制約は外れた。
  #
  # ⚠️ **この値は「どの環境か」の唯一の根拠。** 管理画面が
  #    staging と production を出し分けるときもここを見る。
  #    本番なのに `staging` と名乗っていると、危険な操作の前に出す
  #    確認が「これは staging だから大丈夫」という誤解を招く。
  #
  # ⚠️ **`production` にすると起動条件が厳しくなる。**
  #    LOG_LEVEL が trace/debug でないこと、DATABASE_URL が
  #    ローカルを指していないこと、AUTH_PROVIDER が dev でないこと。
  #    どれかを崩すと**起動せずに終了する**。
  APP_ENV = "production"
  # Node の最適化のためのもので、APP_ENV とは別物。こちらは production でよい。
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  API_PORT = "8080"

  # 画像の保存先（UD-508）。
  #
  # ⚠️ **秘密でない設定はここに置く。**
  #    ダッシュボードで直接入れると、誰がいつ何に変えたかが残らない。
  #    ここに書けば変更がレビューを通り、履歴も残る。
  #    鍵（R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY）だけ `fly secrets` へ。
  MEDIA_STORAGE_PROVIDER = "r2"
  # R2 に割り当てた Custom Domain。⚠️ 署名付き・期限付きの URL を書かない。
  MEDIA_PUBLIC_BASE_URL = "https://media.commitrev.com"
  R2_BUCKET = "sennokunnft-media"
  # S3 エンドポイントに含まれる公開値。鍵ではない。
  R2_ACCOUNT_ID = "0986e8595c5a9054807e36c44fcb58c0"

[processes]
  app = "node apps/api/dist/main.js"

[http_service]
  internal_port = 8080
  force_https = true
  processes = ["app"]

  # ⚠️ **アイドルで止めない。**
  #    止まると最初の要求が待たされる。OVEW Wallet の Claim は
  #    利用者の操作の途中で来るので、そこで待たせたくない。
  auto_stop_machines = "off"
  auto_start_machines = true

  # ⚠️ **段階1 は 1 台。2 台にする前にレート制限を DB 実装へ差し替える。**
  #    いまはプロセス内メモリで数えているため、台数を増やすと
  #    実効上限が台数倍になる。落ちないしログにも出ない。
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# ⚠️ **liveness に /readyz を使わない。**
#    DB が一時的に落ちたときにマシンが再起動を繰り返し、
#    DB が戻っても復帰が遅れる。生死は /healthz で見る。
[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]
